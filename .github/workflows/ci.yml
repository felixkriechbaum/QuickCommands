name: CI

on:
  push:
    branches: [main]
    # The server has its own workflow (server.yml).
    paths-ignore: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths-ignore: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Test
        # The execution tests run the generated scripts in the shells of the runner (pwsh, cmd, bash, zsh).
        run: dotnet test --configuration Release

  screenshots:
    # Renders the whole UI headless – shows that it starts and looks right on Linux and macOS.
    name: UI smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Render
        run: dotnet run --project tools/QuickCommands.Screenshots -c Release -- screenshots en
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots/*.png
