name: Server

# Build, test and – on main – publish the server image to GHCR.
# Version: YEAR.MONTH.run_number (e.g. 2026.11.57); tags: <version> and latest, plus the git tag server/<version>.
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (also regenerates openapi/v1.json)
        run: dotnet build QuickCommands.Server.slnx -c Release
      - name: OpenAPI document is up to date
        run: |
          if ! git diff --exit-code -- openapi/; then
            echo "::error::server/openapi/v1.json is outdated – run 'dotnet build' in server/ and commit the file."
            exit 1
          fi
      - name: Test (integration tests start MySQL 8.4 via Testcontainers)
        run: dotnet test QuickCommands.Server.slnx -c Release --no-build

  image:
    name: Docker image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # git tag server/<version>
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "version=$(date -u +%Y).$(date -u +%-m).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quickcommands-server" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Git tag
        run: |
          git tag "server/${{ steps.meta.outputs.version }}"
          git push origin "server/${{ steps.meta.outputs.version }}"
