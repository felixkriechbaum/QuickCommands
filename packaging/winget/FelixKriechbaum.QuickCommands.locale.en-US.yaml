ShortDescription: Define your own terminal commands for PowerShell, cmd and bash/zsh in a GUI.
Description: |-
  QuickCommands turns one word into a task: create a folder and change into it, open your IDE, deploy a project.
  Commands are edited in a code editor with syntax highlighting, can declare parameters with help and tab completion,
  and are available in PowerShell, cmd and bash/zsh right after saving.
