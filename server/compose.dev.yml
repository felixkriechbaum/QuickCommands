# Local development: only MySQL. The API runs with "dotnet run --project src/QuickCommands.Server"
# (appsettings.Development.json points to this database on port 3307).
name: quickcommands-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quickcommands
      MYSQL_USER: quickcommands
      MYSQL_PASSWORD: quickcommands
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
